<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>专升本备考 · 章节学习</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#17202a;--sub:#6b7280;--line:#e3e8ef;--blue:#2563eb;--blue-l:#eaf1ff;--green:#0a8a5f;--green-l:#e9f9f2;--red:#d93a3a;--red-l:#fdecec;--amber:#c97700;--amber-l:#fff6e5;--no:#eef2f8;--r:14px}
body.dark{--bg:#13171f;--card:#1d2430;--ink:#e6eaf2;--sub:#9aa6b8;--line:#2b3547;--blue:#5b8cf7;--blue-l:#18233a;--green:#34d399;--green-l:#0f2c22;--red:#f87171;--red-l:#331b1b;--amber:#fbbf24;--amber-l:#33280e;--no:#262f3d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7}
header{position:sticky;top:0;z-index:50;background:#101c33;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
header .ttl{font-size:17px;font-weight:700}
header .sub{font-size:12px;color:#9fb0c8}
header .grow{flex:1}
.pbar{height:8px;border-radius:99px;background:#26354e;overflow:hidden;width:180px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#818cf8);transition:width .4s}
header .ph{margin-top:2px;font-size:11px;color:#9fb0c8}
#menuBtn{display:none;background:none;border:1px solid #33415c;color:#fff;border-radius:8px;padding:4px 10px;font-size:18px;cursor:pointer}
#main{max-width:960px;margin:0 auto;padding:20px 16px 90px}
h2.pg{font-size:21px;margin-bottom:4px}
.dsc{color:var(--sub);font-size:13px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card h3{font-size:15px;margin-bottom:10px}
.muted{color:var(--sub);font-size:13px}
.btn{display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 18px;border-radius:10px;cursor:pointer;font-size:14px;user-select:none;transition:.12s}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:#1d4ed8;color:#fff}
.btn.grn{background:var(--green);border-color:var(--green);color:#fff}
.btn.sm{padding:5px 12px;font-size:13px}
.btn.dis{opacity:.4;pointer-events:none}
.brow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
/* 学习路径 */
.subject{margin-bottom:20px}
.subject .shead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.subject .shead .ic{font-size:22px}
.subject .shead b{font-size:17px}
.subject .shead .prog{margin-left:auto;font-size:12px;color:var(--sub)}
.chap{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:.12s}
.chap:hover{border-color:var(--blue);box-shadow:0 2px 8px rgba(37,99,235,.12)}
.chap.lock{opacity:.55;cursor:not-allowed}
.chap.done{border-left:4px solid var(--green)}
.chap.cur{border-left:4px solid var(--blue);background:var(--blue-l)}
.chap .no{width:34px;height:34px;border-radius:50%;background:var(--no);color:#475569;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.chap.done .no{background:var(--green);color:#fff}
.chap.cur .no{background:var(--blue);color:#fff}
.chap .ct{flex:1;min-width:0}
.chap .ct b{display:block;font-size:14px}
.chap .ct span{font-size:12px;color:var(--sub)}
.chap .st{font-size:12px;color:var(--sub);flex-shrink:0}
.chap .st.lock{color:var(--amber)}
.chap .st.ok{color:var(--green);font-weight:600}
/* 做题 */
.qbox{padding:16px 0;border-bottom:1px dashed var(--line)}
.qbox:last-child{border-bottom:none}
.qstem{font-size:15px;margin-bottom:12px;white-space:pre-wrap}
.qno{color:var(--blue);font-weight:700;margin-right:6px}
.qopt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;margin:6px 0;cursor:pointer;font-size:14px}
.qopt:hover{border-color:var(--blue);background:var(--blue-l)}
.qopt.correct{border-color:var(--green);background:var(--green-l);color:var(--green);font-weight:600}
.qopt.wrong{border-color:var(--red);background:var(--red-l);color:var(--red)}
.qopt.dis{pointer-events:none;opacity:.85}
.qans{margin-top:10px;padding:12px 14px;background:var(--amber-l);border:1px solid #f6dfb4;border-radius:10px;font-size:14px;display:none;white-space:pre-wrap}
.qans.show{display:block}
.qans b{color:var(--amber)}
.qin{width:100%;max-width:640px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;margin-top:8px}
.qin:focus{outline:none;border-color:var(--blue)}
.selfk{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.progress-line{height:6px;background:#eef2f8;border-radius:99px;overflow:hidden;margin:10px 0}
.progress-line i{display:block;height:100%;background:var(--blue);transition:width .3s}
.score-float{position:fixed;top:74px;right:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.1);z-index:40}
/* 错题本 */
.wb{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:#fff}
.tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;margin-right:8px}
.tag.en{background:var(--blue-l);color:var(--blue)}.tag.math{background:var(--green-l);color:var(--green)}.tag.cn{background:var(--amber-l);color:var(--amber)}
.vidgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.vidcard{display:block;border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-decoration:none;color:var(--ink);background:#fff}
.vidlist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.vidrow{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:8px;padding:9px 12px;text-decoration:none;color:var(--ink);background:#fff}
.vidrow b{flex:1;font-size:13px}
.vidrow span{color:var(--muted);font-size:12px;white-space:nowrap}
.brow.wrap{flex-wrap:wrap;gap:8px}
.qimg{max-width:100%;border-radius:8px;margin:8px 0;display:block}
.qimgmiss{background:#fff8e1;border:1px solid #f0d48a;color:#8a6d1a;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:13px}
.vwrow{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--line)}
.vwrow:last-child{border-bottom:none}
.vwrow.ok{background:#f0f9f0}
.vwrow.no{background:#fdf0f0}
.vwbody{flex:1;min-width:0}
.vwbody .vwm{margin-top:4px;font-size:13px;color:var(--ink)}
.brow.col{flex-direction:column;align-items:flex-end;gap:6px;min-width:96px;margin-top:2px}
.vwtag{font-size:12px;padding:3px 8px;border-radius:6px}
.vwtag.ok{background:#e3f2e3;color:#2e7d32}
.vwtag.no{background:#fdeaea;color:#c62828}
.vidcard:hover{border-color:var(--blue)}
.vidcard b{font-size:13px;color:var(--blue);display:block;margin-bottom:2px}
.vidcard span{font-size:12px;color:var(--sub)}
.wy{white-space:pre-wrap;font-size:14px;line-height:1.95;color:#374151}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.phitem{text-align:center;border:1px solid var(--line);border-radius:10px;padding:9px 4px;background:#fff}
.phitem .sym{font-size:19px;color:var(--blue);font-weight:700}
.phitem .demo{font-size:12px;color:var(--sub)}
.foot-note{margin-top:20px;padding:14px;background:var(--amber-l);border:1px solid #f6dfb4;border-radius:12px;font-size:12px;color:#7a5200}
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#101c33;color:#fff;padding:9px 22px;border-radius:99px;font-size:13px;z-index:99;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.toast.show{opacity:1}
@media(max-width:820px){
  #menuBtn{display:block}
  #sideNav{display:none}
  #sideNav.open{display:block;position:fixed;inset:0;background:#101c33;z-index:60;padding:20px;overflow:auto}
  header .pbar{width:110px}
  .score-float{position:static;margin:10px 0}
}
#sideNav{display:none}
#sideNav.open{display:block}
/* 背单词专栏 */
.vws-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.vws{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.vws b{font-size:20px;color:var(--blue);display:block;line-height:1.3}
.vws span{font-size:12px;color:var(--sub)}
.pbar.big{width:100%;height:12px;margin:6px 0 4px}
.pbar.big i{background:linear-gradient(90deg,#38bdf8,#2563eb,#0a8a5f)}
.vwword{text-align:center;padding:24px 10px 8px}
.snd{border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:12px;border-radius:8px;padding:2px 6px;margin:0 4px;vertical-align:middle}
.snd:hover{border-color:var(--blue);color:var(--blue)}
.vwword b{font-size:34px;color:#101c33;letter-spacing:.5px}
.vwphon{display:block;font-size:15px;color:var(--sub);margin-top:4px}
.vwfreq{display:inline-block;font-size:12px;background:var(--blue-l);color:var(--blue);border-radius:99px;padding:2px 10px;margin-top:6px}
.vwans{margin-top:16px;padding:14px;background:var(--blue-l);border:1px solid #c7dbfe;border-radius:12px}
.vwans .vwm{font-size:15px;white-space:pre-wrap}
.vwcard .progress-line{height:8px}
/* 整体 UI 微调 */
header{background:linear-gradient(135deg,#0f1e3d,#17325e 55%,#1d4ed8)}
body{background:linear-gradient(180deg,#f3f6fb,#eaf0fa)}
.card{box-shadow:0 1px 3px rgba(16,28,51,.05)}
.card h3{margin-bottom:10px}
.btn{border-radius:10px;box-shadow:0 1px 2px rgba(16,28,51,.04)}
.btn.pri{background:linear-gradient(135deg,#2563eb,#1d4ed8)}
.btn.pri:hover{background:linear-gradient(135deg,#1d4ed8,#1e40af)}
.chap{box-shadow:0 1px 3px rgba(16,28,51,.05)}
.chap:hover{box-shadow:0 4px 14px rgba(37,99,235,.14)}
.pg em{font-style:normal}
/* ===== v2.33 全面 UI 优化 ===== */
/* 数字统计卡（首页/统计页通用） */
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;box-shadow:0 2px 6px rgba(16,28,51,.06);transition:.15s}
.stat:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(37,99,235,.12)}
.stat .v{font-size:26px;font-weight:800;color:var(--blue);line-height:1.15}
.stat .v.g{color:var(--green)}.stat .v.r{color:var(--red)}.stat .v.a{color:var(--amber)}
.stat .k{font-size:12px;color:var(--sub);margin-top:3px}
/* 首次使用引导卡 */
.guide{border:1px solid #c7dbfe;background:linear-gradient(135deg,#eaf1ff,#f7fbff);border-radius:14px;padding:13px 16px;margin-bottom:14px;font-size:13px;color:#1e3a8a;line-height:1.8}
body.dark .guide{background:linear-gradient(135deg,#18233a,#1d2430);border-color:#2b3547;color:#c9d8f5}
.guide b{font-size:14px}
.guide .x{float:right;background:none;border:none;color:#7b9be0;cursor:pointer;font-size:15px;line-height:1}
/* 顶部模式 tab：小屏横向滚动 */
#modeTabs{overflow-x:auto;scrollbar-width:thin;white-space:nowrap;padding-bottom:2px;-webkit-overflow-scrolling:touch}
#modeTabs::-webkit-scrollbar{height:4px}
#modeTabs .btn{margin:0 2px 2px 0}
/* 章节卡片：微型进度条 */
.chapmini{height:4px;background:var(--no);border-radius:99px;margin-top:6px;overflow:hidden}
.chapmini i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#2563eb);border-radius:99px}
body.dark .chapmini{background:#2b3547}
/* 选项按钮：更大点击区 + hover 抬升 */
.qopt{padding:11px 16px;border-radius:12px;transition:.12s}
.qopt:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(37,99,235,.15)}
/* 题干：浅底卡片 */
.qstem{font-size:15.5px;padding:10px 14px;background:#f8fafc;border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
body.dark .qstem{background:#1d2430}
/* 空状态 */
.empty{text-align:center;padding:44px 10px;color:var(--sub)}
.empty .e{font-size:42px;margin-bottom:8px}
/* 评级徽章 */
.badge{display:inline-block;min-width:34px;padding:3px 12px;border-radius:99px;font-weight:800;font-size:15px;text-align:center;color:#fff}
.badge.S{background:linear-gradient(135deg,#f59e0b,#fbbf24)}
.badge.A{background:var(--green)}.badge.B{background:var(--blue)}
.badge.C{background:var(--amber)}.badge.D{background:var(--red)}
/* 成绩卡 */
.result-card{text-align:center;padding:26px 16px}
.result-card .big{font-size:46px;font-weight:800;color:var(--blue)}
.result-card .big.ok{color:var(--green)}.result-card .big.no{color:var(--red)}
/* 全局滚动条 */
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#c3cede;border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#a9b8ce;background-clip:content-box;border:2px solid transparent}
::-webkit-scrollbar-track{background:transparent}
/* toast 加强 */
.toast{box-shadow:0 8px 24px rgba(16,28,51,.32);font-weight:600}
/* 视频卡片 hover */
.vidcard,.vidrow{transition:.12s}
.vidcard:hover,.vidrow:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(16,28,51,.10)}
/* 收藏/错题条目 hover */
.wb{transition:.12s}
.wb:hover{box-shadow:0 3px 10px rgba(16,28,51,.08)}
/* 小屏：按钮更易点 */
@media(max-width:820px){
  .btn{padding:9px 16px}
  .stat .v{font-size:22px}
  .qstem{font-size:15px}
}
/* ===== v2.49 手机端全面适配（竖屏/触屏） ===== */
/* 刘海屏安全区（MDN 推荐 env(safe-area-inset-*)，无刘海设备返回 0，不影响电脑版） */
body{padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left)}

}

  html{-webkit-text-size-adjust:100%}

<body>
<header>
  <button id="menuBtn">☰</button>
  <div><div class="ttl">📚 专升本·春考·单招 学习</div><div class="sub">按顺序学 · 自动记进度 · 章节评分</div></div>
  <div class="grow"></div>
  <div class="brow" id="modeTabs" style="margin:0;flex-wrap:wrap;justify-content:flex-end;gap:4px;max-width:560px">
    <button class="btn sm pri mtab" data-mode="zsb">📚 专升本</button>

function vwWords(){
  const out=[];const seen={};
  const rk=w=>({高:0,h:0,中:1,m:1,低:2,l:2}[w.f]===undefined?3:({高:0,h:0,中:1,m:1,低:2,l:2}[w.f]));
  const all=(D.words||[]).slice();
  all.sort((a,b)=>rk(a)-rk(b));
  const add=(w,f)=>{const k=String(w.w||"").toLowerCase();if(k&&!seen[k]){seen[k]=1;out.push({w:w.w,p:w.p||"",m:w.m||"",f:f||""})}};
  all.forEach(w=>add(w,w.f));
  (VW||[]).forEach(w=>add(w,"单招高频"));
  return out;
}

// 背单词·默写词池：按「默写范围」取词——all=生词本全部+今日词补足；today=只今天背的；wb=只生词本（打字默写/报词听写共用）
function vwPool(){
  const list=vwList(),wb=vwWb(),N=cfgDailyN(),cursor=vwPg().cursor||0,scope=cfgLoad().vwScope||"all";
  const pool=[];
  const addW=(w)=>{if(!pool.find(x=>x.w===w.w))pool.push(w)};
  if(scope==="wb"||scope==="all") wb.forEach(w=>{const src=list.find(x=>x.w===w.w);if(src)addW(src)});
  if(scope==="today"||scope==="all") list.slice(cursor,cursor+Math.max(N,20)).forEach(w=>{if(pool.length>=40)return;addW(w)});
  return pool;
}

      ${D.gap>0?`<div class="muted" id="gapTip" style="margin-top:6px">⏳ <span id="gapN">${D.gap}</span> 秒后自动进入下一题（点下方自评立即下一题）</div>`:""}

// 背单词·列表模式：一次浏览今日全部单词，逐个标记认识/不认识，全部标记完即打卡
function renderVwList(){
  const p=vwPg(),N=cfgDailyN();
  const start=p.cursor||0;
  const words=vwList().slice(start,start+N);
  if(!words.length){toast("词库已全部背完 🎉");return}
  window._vwL={start,words,marks:new Array(words.length).fill(0)};
  paintVwList();
}
function paintVwList(){
  const L=window._vwL;if(!L)return;
  const done=L.marks.filter(m=>m!==0).length;
  $("#main").innerHTML=`<h2 class="pg">📋 今日词表 · 列表模式</h2>
  <p class="dsc">一次浏览今天要背的 ${L.words.length} 个词（词库第 ${L.start+1}~${L.start+L.words.length}/${vwList().length} 个）。逐个标记『✓ 认识』或『✗ 不认识』：认识的行变绿，不认识的自动进生词本复习。全部标记完成即打卡成功，进度自动保存。</p>
  <div class="card"><div class="pbar big"><i style="width:${Math.round(done/L.words.length*100)}%"></i></div><div class="muted">已标记 ${done}/${L.words.length} 个 · ${done>=L.words.length?"🎉 今日任务完成，点击下方按钮打卡":""}</div></div>
  <div class="card">${L.words.map((w,i)=>`<div class="vwrow${L.marks[i]===1?" ok":L.marks[i]===2?" no":""}">
    <b class="vwi">${i+1}.</b><div class="vwbody"><b>${esc(w.w)}</b><button class="snd" data-snd="${esc(w.w)}" title="发音（朗读该单词）">🔊</button><span class="vwphon"> ${esc(w.p||"")}</span><span class="vwfreq"> ${esc(w.f||"")}</span>
    <div class="vwm">${esc(w.m||"释义待补充（来源未提供）")}</div></div>
    <div class="brow col">${L.marks[i]===0?`<button class="btn sm pri" data-k="${i}" data-m="1">✓ 认识</button><button class="btn sm" data-k="${i}" data-m="2">✗ 不认识</button>`:`<span class="vwtag ${L.marks[i]===1?"ok":"no"}">${L.marks[i]===1?"✅ 已认识":"📌 已进生词本"}</span>`}</div>
  </div>`).join("")}</div>
  <div class="brow"><button class="btn pri" id="vwLdone" ${done<L.words.length?"disabled":""}>${done>=L.words.length?"✅ 今日打卡完成 · 返回":"⏹ 结束本轮（返回首页）"}</button><button class="btn" id="vwLback">返回背单词首页</button></div>`;
  $$("#main .vwrow button[data-k]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.k,known=b.dataset.m==="1";
    L.marks[i]=known?1:2;
    if(!known){
      const w=L.words[i],wb=vwWb();
      if(!wb.find(x=>x.w===w.w)){wb.push({w:w.w,p:w.p||"",m:w.m||"",at:Date.now()});vwWbSave(wb)}
    }
    paintVwList();
  });
  $$("#main .snd[data-snd]").forEach(b=>b.onclick=()=>speakWord(b.dataset.snd));
  const dl=$("#vwLdone");if(dl)dl.onclick=()=>{
    const p=vwPg(),d=L.marks.filter(m=>m!==0).length;
    if(d>=L.words.length){
      const np={cursor:(p.cursor||0)+L.words.length,doneToday:L.words.length,doneDays:(p.doneDays||0)+1,last:Date.now(),lastDone:L.words.length};
      vwPgSave(np);toast("✅ 今日背词完成，已打卡");
    }
    renderVwHome();
  };
  const bk=$("#vwLback");if(bk)bk.onclick=renderVwHome;
}
let vwQuiz=null;
function startVwDaily(extra){
  const p=vwPg(),N=cfgDailyN();
  vwQuiz={cur:p.cursor||0,done:extra?(p.doneToday||0):0,target:N,extra:!!extra};
  nextVwQ();
}
function nextVwQ(){
  const p=vwPg(),N=cfgDailyN();
  if(!vwQuiz.extra&&vwQuiz.done>=N){finishVwDay();return}
  if(vwQuiz.cur>=vwList().length){finishVwAll();return}
  const w=vwList()[vwQuiz.cur];
  const barPct=vwQuiz.extra?Math.round((vwQuiz.cur-p.cursor)/(Math.max(1,vwList().length-(p.cursor||0)))*100):Math.min(100,Math.round(vwQuiz.done/N*100));
  $("#main").innerHTML=`<div class="card vwcard">
    <div class="progress-line"><i style="width:${Math.max(4,barPct)}%"></i></div>
    <div class="muted">${vwQuiz.extra?"继续多背 · ":"今日第 "+(vwQuiz.done+1)+"/"+N+" 个 · "}词库第 ${vwQuiz.cur+1}/${vwList().length} 个</div>
    <div class="vwword"><b>${esc(w.w)}</b><button class="snd" data-snd="${esc(w.w)}" title="发音（朗读该单词）">🔊</button><span class="vwphon">${esc(w.p||"")}</span><span class="vwfreq">${esc(w.f||"")}</span></div>
    <div class="vwans" id="vwA" hidden><p class="vwm">${esc(w.m||"释义待补充（来源未提供）")}</p>
    <div class="brow"><button class="btn pri" id="vwK">✅ 认识</button><button class="btn" id="vwN">❌ 不认识 · 进生词本</button></div></div>
    <div class="brow"><button class="btn pri sm" id="vwShow">💡 显示释义</button><button class="btn sm" id="vwX2">⏹ 结束本轮</button></div>
  </div>`;
  $("#vwShow").onclick=()=>{const a=$("#vwA");if(a)a.hidden=false;$("#vwShow").disabled=true};
  const snd=$("#main .snd[data-snd]");if(snd)snd.onclick=()=>speakWord(snd.dataset.snd);
  $("#vwK").onclick=()=>vwMark(true);
  $("#vwN").onclick=()=>vwMark(false);
  $("#vwX2").onclick=renderVwHome;
}
function speakWord(w){
  try{
    if(!window.speechSynthesis){toast("当前环境不支持发音（浏览器语音功能不可用）");return}
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(w));
    u.lang="en-US";u.rate=0.85;u.pitch=1;
    speechSynthesis.speak(u);
  }catch(e){toast("发音失败："+e.message)}
}
function speakCn(t){
  try{
    if(!window.speechSynthesis){toast("当前环境不支持朗读（浏览器语音功能不可用）");return}
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(t));
    u.lang="zh-CN";u.rate=0.95;u.pitch=1;
    speechSynthesis.speak(u);
  }catch(e){toast("朗读失败："+e.message)}
}
function vwMark(known){
  const p=vwPg(),w=vwList()[vwQuiz.cur];
  vwQuiz.cur++;vwQuiz.done++;
  if(!known){
    const wb=vwWb();if(!wb.find(x=>x.w===w.w)){wb.push({w:w.w,p:w.p||"",m:w.m||"",at:Date.now()});vwWbSave(wb)}
  }
  p.cursor=Math.max(p.cursor||0,vwQuiz.cur);
  p.doneToday=(p.doneToday||0)+1;
  vwPgSave(p);
  nextVwQ();
}
function finishVwDay(){
  const p=vwPg(),t=vwToday(),N=cfgDailyN();
  if(p.lastDone!==t){p.doneDays=(p.doneDays||0)+1;p.lastDone=t}
  p.doneToday=p.doneToday||N;
  vwPgSave(p);
  $("#main").innerHTML=`<div class="card vwcard"><h3>🎉 今日 ${N} 词完成！</h3>
    <p>今日已背 <b>${p.doneToday}</b> 个，累计 <b>${p.cursor||0}/${vwList().length}</b>，打卡 <b>${p.doneDays||0}</b> 天。</p>

    <div class="brow"><button class="btn pri" id="vwMore">继续多背</button><button class="btn" id="vwH">返回单词首页</button><button class="btn" id="vwR">📚 复习生词</button></div></div>`;

}

      <div class="brow"><button class="btn pri sm" id="vwS2">💡 显示释义</button><button class="btn sm" id="vwX">⏹ 结束复习</button></div></div>`;

async function fetchUpdJson(){
  for(const u of [UPDATE_URL, UPDATE_URL_ALT, UPDATE_URL_ALT2]){
    if(!u)continue;
    try{
      const r=await fetch(u+"?t="+Date.now());if(!r.ok)throw 0;
      const txt=await r.text();
      // 兼容 UTF-8 BOM 等前导空白，避免 JSON 解析失败
      const j=JSON.parse(txt.replace(/^\uFEFF/,"").trim());
      if(j&&j.ver)return j;

  }
  return null;
}

function nextRec(){
  const q=quiz,qz=$("#reczone");if(!qz||!q)return;
  if(q.done>=q.total){finishRec();return}
  const s=q.sents[q.idx];
  const meta=s.meta||{};
  const full=meta["原文"]||s.text;
  const chars=[...full.replace(/[，。；、！？：“”‘’（）\s]/g,"")];
  if(!chars.length){q.idx++;q.done++;nextRec();return}
  // 每句随机挖 2-3 个易错位置（含字母数字则多挖，纯汉字句挖 min(3) 个）
  const nBlanks=Math.max(2,Math.min(3,chars.length));
  const blanks=shuffle(chars.map((c,i)=>i).slice(0,Math.max(nBlanks,chars.length))).slice(0,nBlanks).sort((a,b)=>a-b);
  q.curBlank={full,chars,blanks,bi:0,hint:meta["主旨/译文"]||meta["定位"]||"",wrong:[]};
  const b=q.curBlank;
  const k=b.blanks[0];
  const correct=chars[k];
  const wrongPool=[...new Set(chars.filter(c=>c!==correct&&!/[a-zA-Z0-9]/.test(c)))];
  const opts=shuffle([correct,...wrongPool.slice(0,3)]);
  let masked="",i=0,shown=0;
  for(const ch of full){
    if(/[，。；、！？：“”‘’（）\s]/.test(ch)){masked+=ch;continue}
    masked+=(b.blanks.includes(i)?"＿＿":ch);i++;
  }
  qz.innerHTML=`<div class="qbox"><div class="qstem"><b>篇目：</b>《${esc(q.c.book.title)}》<br><b>提示：</b>${esc(b.hint)}<br><br>${esc(masked)}</div>
  <div class="brow">${opts.map((o,oi)=>`<button class="btn" data-i="${oi}">${esc(o)}</button>`).join("")}</div>
  <div class="qans" id="ra"><b>整句：</b>${esc(b.full)}<br><b>译文：</b>${esc(b.hint)}${meta["易错点"]?`<br><b>易错点：</b>${esc(meta["易错点"])}`:""}</div></div>
  <div class="progress-line"><i style="width:${Math.round(q.done/q.total*100)}%"></i></div><div class="muted">第 ${q.done+1}/${q.total} 空 · 本句第 ${b.bi+1}/${b.blanks.length} 空</div>`;
  $$("#reczone .btn[data-i]").forEach(x=>x.onclick=()=>answerRec(+x.dataset.i,correct,opts));
}
function answerRec(i,correct,opts){
  const q=quiz,b=q.curBlank;
  const btns=$$("#reczone .btn[data-i]");
  const st=stLoad();
  if(opts[i]===correct){btns[i].classList.add("correct");q.score++;st.right++}
  else{
    btns[i].classList.add("wrong");
    btns[opts.indexOf(correct)].classList.add("correct");
    wbAdd("cn","默写·"+q.c.book.title.split("（")[0],"挖空句（第"+(q.idx+1)+"句·第"+(b.bi+1)+"空）",opts[i],correct,"整句："+b.full);
  }
  st.done++;stSave(st);
  btns.forEach(x=>x.classList.add("dis"));
  b.bi++;
  if(b.bi>=b.blanks.length){
    q.done++;
    q.idx++;
    $("#ra").classList.add("show");
    const n=document.getElementById("rnx2");
    if(!n&&q.done<q.total){
      const bb=document.createElement("button");
      bb.id="rnx2";bb.className="btn pri sm";bb.style.marginTop="10px";
      bb.textContent="下一句 →";
      bb.onclick=()=>nextRec();
      $("#ra").appendChild(bb);
    }
  }else{
    // 同句下一个空：重新生成当前空选项
    const k=b.blanks[b.bi];
    const correct2=b.chars[k];
    const wrongPool=[...new Set(b.chars.filter(c=>c!==correct2&&!/[a-zA-Z0-9]/.test(c)))];
    const opts2=shuffle([correct2,...wrongPool.slice(0,3)]);
    const qz=$("#reczone");
    const brow=qz.querySelector(".brow");
    brow.innerHTML=opts2.map((o,oi)=>`<button class="btn" data-i="${oi}">${esc(o)}</button>`).join("");
    const m=qz.querySelector(".muted");
    if(m)m.textContent=`第 ${q.done+1}/${q.total} 空 · 本句第 ${b.bi+1}/${b.blanks.length} 空`;
    $$("#reczone .btn[data-i]").forEach(x=>x.onclick=()=>answerRec(+x.dataset.i,correct2,opts2));
  }
}

/* ============ 春考英语阅读理解（真题，官方未公开答案，不判分） ============ */
function startRead(c){
  const all=c.passages||[];
  const items=[];
  all.forEach(p=>p.items.forEach(it=>items.push({passage:p,it:it})));
  const p=prog(c.id);
  const target=Math.min(cfgTarget(),Math.max(5,p.state===1?p.total:cfgTarget()),items.length);
  quiz={c,items,idx:0,done:0,total:target};
  $("#main").innerHTML=`<h2 class="pg">${esc(c.title)}</h2>
  <p class="dsc">共 ${items.length} 题（${all.length} 篇文章，2017—2021 山东春考英语真题）。官方未公开答案：作答后显示“来源未提供”，不计对错、不进错题本；做满 ${target} 题即解锁下一章。</p>
  <div class="card" id="rzone"></div>`;
  nextReadQ();
}
function nextReadQ(){

/* ============ 真题池章节（数学考点/语文真题） ============ */
function gNormQ(s){return String(s||"").replace(/[\s\u3000＿_]+/g,"").replace(/[，。？！、；：\u201c\u201d\u2018\u2019\u0022\u0027\u300c\u300d（）()《》〈〉【】·×]/g,"").replace(/\d+分/g,"").slice(0,60)}
function startPool(c){
  const _g=window._gSeenQ||(window._gSeenQ={});
  let dup=0;
  const pool=c.pool.filter(q=>q.typ==="choice"?(q.opts&&Object.keys(q.opts).length>=2):Boolean(q.q)).filter(q=>{
    const k=gNormQ(q.q);
    if(!k)return true;
    if(_g[k]){dup++;return false}
    _g[k]=1;return true;
  });
  const p=prog(c.id);
  const target=Math.min(cfgTarget(),Math.max(5,p.state===1?p.total:cfgTarget()),pool.length||cfgTarget());
  quiz={c,pool,idx:0,score:0,done:0,total:target};
  $("#main").innerHTML=`<h2 class="pg">${esc(c.title)}</h2>
  <p class="dsc">本章可做题 ${pool.length} 题${dup?`（已自动跳过 ${dup} 道与前面章节重复的题）`:""}（未附答案的真题按主观题作答，对照答案区如实显示"来源未提供"），做满 ${target} 题、正确率 ${cfgPass()}% 解锁下一章。</p>
  ${vidsPanel(MODE==="jn"?"math":c.subj==="math"?"math":c.subj==="en"?"en":"chinese")}
  <div class="card" id="pzone"></div>`;
  nextPoolQ();
}
function nextPoolQ(){
  const q=quiz,qz=$("#pzone");if(!qz)return;
  if(q.done>=q.total){finishPool();return}
  const item=pick(q.pool);
  q.cur=item;
  let body=`<div class="qbox"><div class="qstem"><span class="qno">${q.done+1}.</span>${richQ(item.q)}</div>`;
  if(item.opts&&Object.keys(item.opts).length>=2){
    const opts=Object.entries(item.opts);
    body+=opts.map(([k,v])=>`<button class="qopt" data-i="${opts.findIndex(o=>o[0]===k)}">${k}. ${esc(v)}</button>`).join("");
    $("#pzone").innerHTML=body+`<div class="qans" id="pa"></div></div>
    <div class="progress-line"><i style="width:${Math.round(q.done/q.total*100)}%"></i></div><div class="muted">第 ${q.done+1}/${q.total} 题 · 答对 ${q.score}${item.ans?"（点选项即判分）":"（官方未附答案，点选项查看说明，不判分）"}</div>
    <div class="brow"><button class="btn sm" id="favT">${favHas(item.q)?"★ 已收藏":"⭐ 收藏本题"}</button></div>`;
    $$("#pzone .qopt").forEach(b=>b.onclick=()=>answerPoolQ(+b.dataset.i,opts));
  }else{
    body+=`<input class="qin" id="pin" placeholder="写下你的答案或思路，回车或点按钮对照答案…"><div class="qans" id="pa"></div></div>
    <div class="progress-line"><i style="width:${Math.round(q.done/q.total*100)}%"></i></div><div class="muted">第 ${q.done+1}/${q.total} 题 · 主观题：先作答 → 点“对照答案/解析”</div>
    <div class="brow"><button class="btn pri sm" id="pshow">📖 对照答案/解析</button></div>
    <div class="brow"><button class="btn sm" id="favT">${favHas(item.q)?"★ 已收藏":"⭐ 收藏本题"}</button></div>`;
    $("#pzone").innerHTML=body;
    $("#pin").onkeydown=ev=>{if(ev.key==="Enter")showPoolAns()};
    $("#pshow").onclick=showPoolAns;
  }
  const ft=$("#favT");if(ft)ft.onclick=()=>favToggle(q.c.title,q.cur);
}
function selfJudge(item,v,subject,type){
  const q=quiz;  // 必须在此绑定，否则点自评/下一题抛 ReferenceError（历史"点不动"根因）
  // 官方未附答案（或无标准对错）的题：展示参考答案/来源说明后，由用户自评。
  // 自评答错 → 收录错题本（明确标注“自评记录”，不冒充官方答案）。
  const pa=$("#pa");
  pa.innerHTML=`<b>参考答案：</b>${esc(item.ans||"来源未提供（官方未附答案）")}${item.note?`<br><b>解析：</b>${esc(item.note)}`:""}
  <br><span class="muted">请自评本题（可跳过，直接点下一题）：</span>
  <div class="brow" style="margin-top:8px"><button class="btn sm" id="sjR">✅ 我答对了</button><button class="btn sm" id="sjW">❌ 我答错了</button>
  <button class="btn pri sm" id="pnxt" style="margin-left:10px">下一题 →</button></div>`;
  pa.classList.add("show");
  const fin=ok=>{
    const st=stLoad();
    if(ok){q.score++;if(q.c.id==="redo"&&wbRemoveByQ(item.q))toast("✅ 已掌握，移出错题本")}
    if(!ok){
      if(q.c.id==="redo")toast("❌ 答错，保留错题继续巩固");
      else wbAdd(subject,type,item.q,v,item.ans||"来源未提供","自评答错收录（官方未附答案，此条为自评记录）"+(item.note?"；"+item.note:""));
    }
    st.done++;stSave(st);
    q.done++;renderPoolProg();
    const r=$("#sjR"),w=$("#sjW");
    if(r)r.remove();if(w)w.remove();
  };
  const n=document.getElementById("pnxt");
  if(n)n.onclick=()=>{
    // 若尚未自评：直接点下一题时，本题按“已做”计入完成数（不计对错）
    if($("#sjR")){
      const st=stLoad();
      st.done++;stSave(st);
      q.done++;renderPoolProg();
    }
    nextPoolQ();
  };
  const r=$("#sjR"),w=$("#sjW");
  if(r)r.onclick=()=>{fin(true);toast("已记录：自评答对")};
  if(w)w.onclick=()=>{fin(false);toast("已加入错题本")};
}
function showPoolAns(){
  const q=quiz,item=q.cur;
  const v=$("#pin").value.trim();
  const ps=$("#pshow");
  if(ps)ps.disabled=true;  // 防重复点击导致界面状态错乱
  if(v)selfJudge(item,v,item._subj||"math",(item._t||"数学")+"·"+(item.typ==="fill"?"填空":"解答"));
  else { if(ps)ps.disabled=false; toast("请先写下你的答案或思路，再对照参考答案"); }
}
function answerPoolQ(i,opts){
  const q=quiz,item=q.cur;
  const btns=$$("#pzone .qopt");
  const st=stLoad();
  const showAns=()=>{
    $("#pa").innerHTML=`<b>答案：</b>${esc(item.ans||"未提供")}${item.note?`<br><b>解析：</b>${esc(item.note)}`:""}`;
    $("#pa").classList.add("show");
    const n=document.getElementById("pnxt");
    if(!n&&q.done<q.total){
      const b=document.createElement("button");
      b.id="pnxt";b.className="btn pri sm";b.style.marginTop="10px";
      b.textContent="下一题 →";
      b.onclick=()=>{renderPoolProg();nextPoolQ()};
      $("#pa").appendChild(b);
    }
  };
  if(!item.ans){
    // 官方未公开答案：不判分，但提供自评 → 答错可进错题本
    btns[i].classList.add("wrong");
    btns.forEach(b=>b.classList.add("dis"));
    selfJudge(item,opts[i]&&opts[i][1],item._subj||"math",(item._t||"数学")+"·选择题");
    return;
  }
  const correct=item.ans.toUpperCase()===opts[i][0];
  if(correct){btns[i].classList.add("correct");q.score++;st.right++;if(q.c.id==="redo"&&wbRemoveByQ(item.q))toast("✅ 已掌握，移出错题本");else if(q.c.id!=="redo")toast("✅ 回答正确")}
  else{
    btns[i].classList.add("wrong");
    const ri=opts.findIndex(o=>item.ans&&o[0].toUpperCase()===item.ans.toUpperCase());
    if(ri>=0)btns[ri].classList.add("correct");
    if(q.c.id==="redo"){toast("❌ 答错，保留错题继续巩固")}
    else{wbAdd(item._subj||"math",(item._t||"数学")+"·选择题",item.q,opts[i]&&opts[i][1],item.ans,"正确答案："+item.ans+(item.note?"；"+item.note:""));toast("❌ 答错了，已加入错题本")}
  }
  st.done++;stSave(st);
  btns.forEach(b=>b.classList.add("dis"));
  showAns();
  q.done++;
  renderPoolProg();
}
function renderPoolProg(){
  const q=quiz,qz=$("#pzone");
  if(!qz)return;
  const pl=qz.querySelector(".progress-line");
  if(pl)pl.innerHTML=`<i style="width:${Math.round(q.done/q.total*100)}%"></i>`;
}
function finishPool(){
  const q=quiz;
  if(q.c.id==="redo"){  // 重做错题：不占章节进度，答对已实时移出错题本
    dayAdd(q.done,q.score);
    const gr=gradeOf({done:q.done,total:q.total,right:q.score});
    const left=wbLoad().length;
    $("#pzone").innerHTML=`<div class="card"><h3>🎯 错题重做完成</h3><p>共 ${q.done} 题，答对 <b>${q.score}</b>（${Math.round(q.score/q.done*100)}%）。<b>评级：${gr?gr.g+"级 ("+gr.pct+"%)":""}</b></p><p class="muted">答对的题已自动移出错题本（标记已掌握），答错的题保留继续巩固。当前错题本剩余 <b>${left}</b> 道。</p><div class="brow"><button class="btn pri" id="pb">返回错题本</button><button class="btn" id="pa3">🔁 再来一轮</button></div></div>`;
    $("#pb").onclick=renderWrong;
    const b=$("#pa3");if(b)b.onclick=redoWrong;
    return;
  }
  if(q.c.id==="random"||q.c.id==="daily"){  // 随机刷题/每日一练：不占章节进度、不写解锁，只打卡
    dayAdd(q.done,q.score);
    const gr=gradeOf({done:q.done,total:q.total,right:q.score});
    const daily=q.c.id==="daily";
    $("#pzone").innerHTML=`<div class="card"><h3>${daily?"📅 今日打卡完成":"🎲 随机刷题完成"}</h3><p>共 ${q.done} 题，答对 <b>${q.score}</b>（${Math.round(q.score/q.done*100)}%）。<b>评级：${gr?gr.g+"级 ("+gr.pct+"%)":""}</b></p><p class="muted">${daily?`已计入「连续学习天数」，今天已做 <b>${(dayLoad()[dayKey()]||{}).n||0}</b> 题、连续学习 <b>${dayStreak()}</b> 天。`:""}题目来自当前专栏全部章节随机抽取，答错的已自动进错题本，不占用章节通关进度。</p><div class="brow"><button class="btn pri" id="pb">返回路径</button><button class="btn" id="pa3">${daily?"📅 再做一组":"🎲 再刷一组"}</button></div></div>`;
    $("#pb").onclick=renderPath;
    const b=$("#pa3");if(b)b.onclick=daily?startDaily:startRandom;
    return;
  }
  setProg(q.c.id,q.done,q.total,q.score);
  dayAdd(q.done,q.score);
  const pass=q.score>=Math.ceil(q.total*cfgPass()/100);
  const gr=gradeOf({done:q.done,total:q.total,right:q.score});
  $("#pzone").innerHTML=`<div class="card"><h3>✅ 本章完成</h3><p>${q.done} 题，答对 <b>${q.score}</b>（${Math.round(q.score/q.done*100)}%）。<b>本章评级：${gr?gr.g+"级 ("+gr.pct+"%)":""}</b></p><p class="muted">${pass?"通过，下一章已解锁。":"未达 60%，可再练一组。"}</p><div class="brow"><button class="btn pri" id="pb">返回路径</button>${pass?"":"<button class='btn' id='pa3'>再练一组</button>"}</div></div>`;
  $("#pb").onclick=renderPath;
  const b=$("#pa3");if(b)b.onclick=()=>startPool(q.c);
}
/* 错题本·一键重做：做对的题自动移出错题本（标记已掌握），做错的保留继续巩固 */
function wbRemoveByQ(q){
  const all=wbLoad();
  const k=String(q||"").replace(/\s+/g,"").slice(0,80);
  const idx=all.findIndex(x=>String(x.q||"").replace(/\s+/g,"").slice(0,80)===k);
  if(idx>=0){all.splice(idx,1);wbSave(all);return true}
  return false;
}
function redoWrong(){
  const all=wbLoad();
  const wb=all.filter(x=>{
    const m=x.mode||"other";
    if(wbFilt!=="all"&&m!==wbFilt)return false;
    if(wbKW&&!(String(x.q||"").includes(wbKW)||String(x.type||"").includes(wbKW)))return false;
    return true;
  });
  if(!wb.length){toast("当前筛选下没有错题可重做");return}
  // 优先从五模式题库找回原题（带选项/解析），找不到的按主观题自评
  const bank={};
  const chapters=[].concat(ALLCH||[]).concat(CKCH?CKCH.en.concat(CKCH.math).concat(CKCH.cn):[]).concat(DZCH?DZCH.en.concat(DZCH.math).concat(DZCH.cn):[]).concat(JNCH?JNCH.en.concat(JNCH.math).concat(JNCH.cn):[]).concat(ZZCH?ZZCH.en.concat(ZZCH.math).concat(ZZCH.cn):[]);
  chapters.forEach(c=>{if(c.kind==="pool"&&c.pool)c.pool.forEach(q=>{if(q&&q.q){const k=String(q.q).replace(/\s+/g,"").slice(0,80);if(!bank[k])bank[k]=q}})});
  const items=wb.map(x=>{
    const k=String(x.q||"").replace(/\s+/g,"").slice(0,80);
    const src=bank[k];
    return src?Object.assign({},src,{_redo:true}):Object.assign({},x,{_redo:true});
  }).filter(x=>x&&x.q);
  if(!items.length){toast("当前筛选下没有可重做的错题");return}
  for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=items[i];items[i]=items[j];items[j]=t}
  const pool=items.slice(0,40);
  quiz={c:{id:"redo",title:"🎯 重做错题",pool},pool,idx:0,score:0,done:0,total:pool.length};
  $("#main").innerHTML=`<h2 class="pg">🎯 重做错题</h2>
  <p class="dsc">从当前筛选错题中随机抽 ${pool.length} 道重做（已从题库找回原题，带选项）：<b>答对的题自动移出错题本（标记已掌握），答错的题保留继续巩固</b>。不占章节通关进度，进度自动保存。</p>
  <div class="card" id="pzone"></div>`;
  nextPoolQ();
}
/* 随机刷题：从当前专栏全部章节题库随机抽题（题量可在设置中调整，默认 20，优先带答案的题），不占章节进度 */
function startRandom(){
  const all=curAll();
  let items=[];const seenQ={};
  all.forEach(c=>{if(c.kind==="pool"&&c.pool&&c.pool.length)c.pool.forEach(q=>{
    const k=gNormQ(q.q);if(!k||seenQ[k])return;seenQ[k]=1;
    items.push(Object.assign({},q,{_t:c.title,_subj:c.subj||"zsb"}));
  })});
  items=items.filter(q=>q.typ==="choice"?(q.opts&&Object.keys(q.opts).length>=2):Boolean(q.q));
  const withAns=items.filter(q=>q.ans),noAns=items.filter(q=>!q.ans);
  const pool=withAns.concat(noAns);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=pool[i];pool[i]=pool[j];pool[j]=t}
  const N=Math.min(cfgLoad().randN||20,pool.length);
  const picked=pool.slice(0,N);
  if(!picked.length){toast("当前专栏暂无题目");return}
  quiz={c:{id:"random",title:"🎲 随机刷题",pool:picked},pool:picked,idx:0,score:0,done:0,total:N};
  $("#main").innerHTML=`<h2 class="pg">🎲 随机刷题</h2>
  <p class="dsc">从当前专栏全部章节题库随机抽取 ${N} 题（优先带答案的题），答错自动进错题本，不占章节通关进度。按 1-4/A-D 选答案、N 下一题。</p>
  <div class="card" id="pzone"></div>`;
  nextPoolQ();
}
/* ============ 每日一练（每天固定 10 题·完成自动打卡计入连续天数） ============ */
function startDaily(){
  const all=curAll();
  let items=[];const seenQ={};
  all.forEach(c=>{if(c.kind==="pool"&&c.pool&&c.pool.length)c.pool.forEach(q=>{
    const k=gNormQ(q.q);if(!k||seenQ[k])return;seenQ[k]=1;
    items.push(Object.assign({},q,{_t:c.title,_subj:c.subj||"zsb"}));
  })});
  items=items.filter(q=>q.typ==="choice"?(q.opts&&Object.keys(q.opts).length>=2):Boolean(q.q));
  const withAns=items.filter(q=>q.ans&&q.ans!=="来源未提供"),noAns=items.filter(q=>!q.ans||q.ans==="来源未提供");
  const pool=withAns.concat(noAns);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=pool[i];pool[i]=pool[j];pool[j]=t}
  const N=Math.min(10,pool.length);
  const picked=pool.slice(0,N);
  if(!picked.length){toast("当前专栏暂无题目");return}
  const today=dayKey().replace(/-/g,".");
  quiz={c:{id:"daily",title:"📅 每日一练",pool:picked},pool:picked,idx:0,score:0,done:0,total:N};
  $("#main").innerHTML=`<h2 class="pg">📅 每日一练（${today}）</h2>
  <p class="dsc">从当前专栏题库随机抽 <b>10 题</b>（优先带答案的题），做完自动打卡，计入「连续学习天数」。答错自动进错题本，不占章节通关进度。今天已做 ${(dayLoad()[dayKey()]||{}).n||0} 题、连续学习 ${dayStreak()} 天。</p>
  <div class="card" id="pzone"></div>`;
  nextPoolQ();
}

/* ============ 整卷模拟考试（真题卷顺序作答·计时·交卷评分） ============ */
let exam=null,examTimer=null;
function fmtTime(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function renderExam(c){
  const items=c.pool.filter(x=>x.q);
  if(!items.length){toast("本章暂无可作答题目");return}
  exam={c,items,idx:0,right:0,locked:false,start:Date.now(),over:false};
  $("#main").innerHTML=`<h2 class="pg">📝 整卷模拟 · ${esc(c.title)}</h2>
  <p class="dsc">按原卷顺序作答，共 ${items.length} 题：选择题点选项立即判分；主观题先写下答案→对照参考答案→自评对错。答完最后一题点「交卷评分」。用时 <b id="exTime">0:00</b> · 已答对 <b id="exRight">0</b> 题</p>
  <div class="card" id="ezone"></div>`;
  if(examTimer){clearInterval(examTimer)}
  examTimer=setInterval(()=>{const el=$("#exTime");if(el)el.textContent=fmtTime((Date.now()-exam.start)/1000|0)},1000);
  nextExamQ();
}
function nextExamQ(){
  if(!exam||exam.over)return;
  if(exam.idx>=exam.items.length){finishExam();return}
  const item=exam.items[exam.idx],i=exam.idx;
  exam.cur=item;
  exam.locked=false;
  let body=`<div class="qbox"><div class="qstem"><span class="qno">${i+1}.</span>${richQ(item.q)}</div>`;
  if(item.opts&&Object.keys(item.opts).length>=2){
    const opts=Object.entries(item.opts);
    body+=opts.map(([k,v])=>`<button class="qopt" data-i="${opts.findIndex(o=>o[0]===k)}">${k}. ${esc(v)}</button>`).join("");
    body+=`<div class="qans" id="ea"></div></div><div class="brow"><button class="btn pri" id="enx">${i+1>=exam.items.length?"交卷评分":"下一题"} ▶</button><button class="btn" id="eqt">⏻ 退出整卷</button></div><div class="brow"><button class="btn sm" id="favT">${favHas(item.q)?"★ 已收藏":"⭐ 收藏本题"}</button></div>`;
    exam.curOpts=opts;
  }else{
    body+=`<input class="qin" id="ein" placeholder="写下你的答案或思路，点对照参考答案…"><div class="qans" id="ea"></div></div>
    <div class="brow"><button class="btn sm" id="esh">📖 对照答案/解析</button><span class="muted">主观题：对照后自评，答对计 1 分</span></div>
    <div class="brow"><button class="btn pri" id="enx">${i+1>=exam.items.length?"交卷评分":"下一题"} ▶</button><button class="btn" id="eqt">⏻ 退出整卷</button></div>
    <div class="brow"><button class="btn sm" id="favT">${favHas(item.q)?"★ 已收藏":"⭐ 收藏本题"}</button></div>`;
  }
  $("#ezone").innerHTML=body;
  const ft=$("#favT");if(ft)ft.onclick=()=>favToggle("整卷·"+exam.c.title,item);
  if(item.opts&&Object.keys(item.opts).length>=2){
    const opts=exam.curOpts;
    $$("#ezone .qopt").forEach(b=>b.onclick=()=>{
      if(exam.locked)return;exam.locked=true;
      const idx=+b.dataset.i;
      const ok=item.ans&&item.ans.trim().toUpperCase()===opts[idx][0].toUpperCase();
      if(ok){exam.right++;b.classList.add("correct")}else{b.classList.add("wrong");const ri=opts.findIndex(o=>item.ans&&o[0].toUpperCase()===item.ans.toUpperCase());if(ri>=0)opts[ri]&&$$("#ezone .qopt")[ri]&&$$("#ezone .qopt")[ri].classList.add("correct");wbAdd("exam","整卷·"+exam.c.title,item.q,"选择："+(opts[idx]||[])[1],item.ans||"来源未提供",item.note||"")}
      $$("#ezone .qopt").forEach(x=>x.classList.add("dis"));
      $("#ea").innerHTML=`${item.ans?`<b>答案：${esc(item.ans)}</b>`:`<span class='muted'>来源未提供标准答案，作答后请自行核对。</span>`}${item.note?`<br><b>解析：</b>${esc(item.note)}`:""}`;
      $("#ea").classList.add("show");
      const r=$("#exRight");if(r)r.textContent=exam.right;
      const n=$("#enx");if(n)n.disabled=false;
    });
  }else{
    const i2=$("#ein");if(i2)i2.onkeydown=ev=>{if(ev.key==="Enter")examShowAns(item)};
    const sh=$("#esh");if(sh)sh.onclick=()=>examShowAns(item);
  }
  const nx=$("#enx");if(nx)nx.onclick=()=>{
    const it=exam.cur;
    if(it&&it.opts&&Object.keys(it.opts).length>=2){ if(!exam.locked){toast("请先点击选项作答，再进入下一题");return} }
    else{ const ea=$("#ea"); if(!ea||!ea.classList.contains("show")){toast("请先写下答案并点“对照答案/解析”");return} }
    exam.idx++;nextExamQ()
  };
  const qt=$("#eqt");if(qt)qt.onclick=quitExam;
}
function examShowAns(item){
  const v=$("#ein").value.trim();
  if(!v){toast("请先写下你的答案或思路，再对照参考答案");return}
  $("#ea").innerHTML=`${item.ans?`<b>答案：</b>${esc(item.ans)}`:`<span class='muted'>来源未提供标准答案，作答后请自行核对。</span>`}${item.note?`<br><b>解析：</b>${esc(item.note)}`:""}`;
  $("#ea").classList.add("show");
  const sh=$("#esh");if(sh)sh.disabled=true;
  if(!$("#esk"))$("#ea").insertAdjacentHTML("afterend",`<div class="selfk" id="esk"><button class="btn sm" data-e="1">✅ 我答对了</button><button class="btn sm" data-e="0">❌ 我答错了</button></div>`);
  $$("#esk [data-e]").forEach(b=>b.onclick=()=>{
    if(b.dataset.e==="1"){exam.right++;const r=$("#exRight");if(r)r.textContent=exam.right}
    else wbAdd("exam","整卷·"+exam.c.title,item.q,"自评：我的答案 "+v.slice(0,200),item.ans||"来源未提供",item.note||"");
    $("#esk").innerHTML=`<span class="muted">已自评：${b.dataset.e==="1"?"✅ 答对":"❌ 答错"}，可进入下一题。</span>`;
    const n=$("#enx");if(n)n.disabled=false;
  });
}
function finishExam(){
  if(exam.over)return;exam.over=true;
  if(examTimer){clearInterval(examTimer);examTimer=null}
  const done=exam.items.length,right=exam.right,miss=done-right;
  const gr=gradeOf({done,total:done,right});
  const sec=(Date.now()-exam.start)/1000|0;
  const st=stLoad();st.done+=done;st.right+=right;stSave(st);
  dayAdd(done,right);
  $("#ezone").innerHTML=`<div class="card"><h3>🎉 整卷完成 · ${esc(exam.c.title)}</h3>
  <p>用时 <b>${fmtTime(sec)}</b> · 共 ${done} 题，答对 <b>${right}</b>（${Math.round(right/done*100)}%）· 答错/未答 ${miss} 题。</p>
  <p><b>本次评级：${gr?gr.g+"级（"+gr.pct+"%）":""}</b>${gr&&gr.g==="S"?" 🏆":""}</p>
  <p class="muted">答错的题已自动加入错题本（四模式共用）。整卷模拟不计入章节通关进度，仅作整卷自测。</p>
  <div class="brow"><button class="btn pri" id="exbk">返回路径</button><button class="btn" id="exag">再考一遍</button></div></div>`;
  $("#exbk").onclick=renderPath;
  $("#exag").onclick=()=>renderExam(exam.c);
}
function quitExam(){
  if(examTimer){clearInterval(examTimer);examTimer=null}
  exam=null;renderPath();
}

function strip(s){return String(s).replace(/<[^>]*>/g,"").trim()}
function downloadTxt(name,text){
  try{
    const blob=new Blob(["\ufeff"+text],{type:"text/plain;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=name;
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
    toast("已导出："+name);
  }catch(err){toast("导出失败："+err.message)}
}

/* 键盘快捷键：答题页按 1-4 / A-D 选答案，N 或 → 下一题，Esc 退出整卷 */
let _kbdReady=false;
function kbdInit(){
  if(_kbdReady)return;_kbdReady=true;
  document.addEventListener("keydown",e=>{
    if((cfgLoad()).hotkeys===false)return;
    const t=e.target;
    if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"))return;
    const k=(e.key||"").toUpperCase();
    if(/^[1-4]$/.test(k)||/^[A-D]$/.test(k)){
      const bs=[...document.querySelectorAll("#pzone .qopt, #ezone .qopt")];
      if(bs.length){
        const idx=/^[1-4]$/.test(k)?(+k-1):(k.charCodeAt(0)-65);
        if(bs[idx]){e.preventDefault();bs[idx].click()}
      }
    }else if(k==="N"||k==="ARROWRIGHT"){
      const n=document.getElementById("pnxt")||document.getElementById("enx");
      if(n&&!n.disabled){e.preventDefault();n.click()}
    }else if(k==="ESCAPE"){
      if(typeof quitExam==="function"&&document.getElementById("ezone")){e.preventDefault();quitExam()}
    }
  });
}

function sjBank(type){
  const bySubj=(arr)=>{const out=[];const seen={};arr.forEach(c=>{if(!c.pool)return;(c.pool||[]).forEach(q=>{if(!q||!q.q)return;const k=gNormQ(q.q);if(!k||seen[k])return;seen[k]=1;out.push(Object.assign({_t:c.title},q))})});return out};
  if(type==="ck"){
    const math=[],cn=[],en=[];
    CK.math_chapters.forEach(c=>{const t=String(c.title);if(t.indexOf("英语")>=0)en.push(c);else if(t.indexOf("语文")>=0)cn.push(c);else math.push(c)});
    CK.cn_pool.forEach(c=>cn.push(c));
    const enX=[CK.en_single,CK.en2023_single,CK.en_new1,CK.en_new2,CK.en_new3,CK.en_new4,CK.en2023_fill].filter(Boolean);
    return {cn:bySubj(cn),en:bySubj(en.concat(enX)),math:bySubj(math)};
  }
  const cn=[],en=[],math=[];
  (DZ.cn_chapters||[]).forEach(c=>{const t=String(c.title);if(t.indexOf("语文")>=0)cn.push(c);else if(t.indexOf("英语")>=0)en.push(c);else if(t.indexOf("数学")>=0)math.push(c)});
  return {cn:bySubj(cn),en:bySubj(en),math:bySubj(math)};
}
function sjDraw(pool,pred,n,exclude){const list=pool.filter(q=>pred(q)&&(!exclude||!exclude[q.q]));const p=shuffle(list.slice()).slice(0,Math.min(n,list.length));if(exclude)p.forEach(q=>{exclude[q.q]=1});return p}
function sjIsChoice(q){return q.typ==="choice"&&q.opts&&Object.keys(q.opts).length>=2}
function sjIsPlainChoice(q){return sjIsChoice(q)&&!/【阅读|阅读理解|Passage/.test(q.q)}
/* 内嵌选项的“的有（）/选项：A、…”多选或选择类题（选项写在题干里、opts 为空）：
   这类题必须优先识别，否则会被作文/阅读/填空/解答判定误收（如“没有语病的有（）”题干含“写作水平”曾被误判成作文题）。 */
function sjIsEmbedChoice(q){return q.typ==="calc"&&/(的有（\s*）|选项[：:]|多项选择)/.test(q.q)&&/[AＡ][、．.]/.test(q.q)}
function sjIsFill(q){if(sjIsEmbedChoice(q))return false;if(q.typ!=="calc"||sjIsEssay(q)||sjIsReadQ(q))return false;if(/默写|____|填空|名句|短文填空|补全对话|对话/.test(q.q))return true;return !/解答|证明|求|计算|设/.test(q.q)}
function sjIsReadChoice(q){return sjIsChoice(q)&&/【阅读|阅读理解|Passage/.test(q.q)}
function sjIsEssay(q){if(sjIsEmbedChoice(q))return false;return q.typ==="calc"&&/(作文|写作题|写作要求|写一篇|不少于\s*\d+\s*字|不得少于|以[““「]|[””」]为(?:话题|题目)|文体不限|题目自拟|扩写)/.test(q.q)}
function sjIsReadQ(q){if(sjIsEmbedChoice(q))return false;return q.typ==="calc"&&!sjIsEssay(q)&&/阅读|理解|赏析|简答|回答|分析/.test(q.q)}
function sjIsSolve(q){if(sjIsEmbedChoice(q))return false;return q.typ==="calc"&&!sjIsEssay(q)&&!sjIsReadQ(q)&&!/默写|____|填空|名句|短文填空|补全对话|对话/.test(q.q)&&/解答|证明|求|计算|设/.test(q.q)}

function genSjPaper(key){
  const [type,subj]=key.split("-");
  const def=SJ_DEF[key];if(!def){toast("未定义的卷型："+key);return}
  const bank=sjBank(type)[subj];
  const ckType=type==="ck"?"春考":"单招";
  const used={};
  const choice=sjDraw(bank,sjIsPlainChoice,def.choiceN,used);
  const embed=sjDraw(bank,sjIsEmbedChoice,Math.max(0,def.choiceN-choice.length),used);
  const fill=sjDraw(bank,sjIsFill,def.fillN||0,used);
  const read=sjDraw(bank,sjIsReadQ,def.readN||0,used);
  const readChoice=sjDraw(bank,sjIsReadChoice,def.readChoiceN||0,used);
  const solve=sjDraw(bank,sjIsSolve,def.solveN||0,used);
  const essay=sjDraw(bank,sjIsEssay,def.essayN||0,used);
  if(!choice.length&&!fill.length&&!read.length&&!readChoice.length&&!solve.length&&!essay.length){toast("该科目题库暂无可组卷的题");return}
  window._sj={key,type,subj,def,ckType,bank,choice,embed,fill,read,readChoice,solve,essay,score:0,done:0,right:0,total:0,marked:{},seq:[]};
  paintSj();
}
function paintSj(){
  const s=window._sj,d=s.def;
  // 构建顺序题目列表：选择题 → 填空 → 阅读问答 → 解答 → 写作
  const seq=[];let qno=0;
  const choiceItems=s.choice.map(it=>{it._pts=d.choiceP;return it}).concat(s.embed.map(it=>{it._pts=d.choiceP;return it})).concat(s.readChoice.map(it=>{it._pts=d.readChoiceP||d.choiceP;return it}));
  choiceItems.forEach(item=>{seq.push({kind:"choice",item,no:++qno})});
  s.fill.forEach(item=>{item._pts=d.fillP;seq.push({kind:"calc",item,no:++qno})});
  s.read.forEach(item=>{item._pts=d.readP;seq.push({kind:"calc",item,no:++qno})});
  s.solve.forEach(item=>{item._pts=d.solveP;seq.push({kind:"calc",item,no:++qno})});
  s.essay.forEach(item=>{item._pts=d.essayP;seq.push({kind:"essay",item,no:++qno})});
  s.seq=seq;
  let total=0;seq.forEach(x=>total+=x.item._pts||0);
  s.total=total;
  const short=(arr,need)=>(need&&arr.length<need)?`<p class="muted" style="margin:4px 0">⚠️ 题库该题型现仅 ${arr.length} 题（不足 ${need} 题），已全数收录，不凑数不编题。</p>`:"";
  const secs=[];
  if(choiceItems.length){
    secs.push(`<div class="card sjsec"><h3>一、选择题（共 ${choiceItems.length} 题，每题 ${d.choiceP} 分，共 ${choiceItems.length*d.choiceP} 分）</h3>${short(choiceItems,d.choiceN+(d.readChoiceN||0))}${choiceItems.map((item,i)=>`<div class="qbox sjq"><div class="qstem"><span class="qno">${seq[i].no}.</span>${richQ(item.q)}</div>${item.opts&&Object.keys(item.opts).length>=2?`<div class="brow wrap">${Object.entries(item.opts).map(([k,v])=>`<button class="qopt sjopt" data-i="${i}" data-k="${k}">${k}. ${esc(v)}</button>`).join("")}</div>`:`<p class="muted" style="margin:6px 0;font-size:12px">⚠️ 多选/内嵌选项题（选项见题干），作答后点「📖 查看答案」对照自评（官方未附逐项判分时按自评记录）</p><div class="brow"><button class="btn sm sjcalc" data-i="${i}">📖 查看答案/解析</button></div>`}<div class="qans sjans"></div></div>`).join("")}</div>`);
  }
  if(s.fill.length){
    secs.push(`<div class="card sjsec"><h3>二、填空（默写/补全对话/短文填空等，共 ${s.fill.length} 题，每题 ${d.fillP} 分）</h3>${short(s.fill,d.fillN)}${s.fill.map((item,i)=>`<div class="qbox sjq"><div class="qstem"><span class="qno">${(choiceItems.length+i+1)}.</span>${richQ(item.q)}</div><div class="brow"><button class="btn sm sjcalc" data-i="${choiceItems.length+i}">📖 查看答案/解析</button></div><div class="qans sjans"></div></div>`).join("")}</div>`);
  }
  if(s.read.length){
    secs.push(`<div class="card sjsec"><h3>三、阅读问答（共 ${s.read.length} 题，每题 ${d.readP} 分）</h3>${short(s.read,d.readN)}${s.read.map((item,i)=>`<div class="qbox sjq"><div class="qstem"><span class="qno">${(choiceItems.length+s.fill.length+i+1)}.</span>${richQ(item.q)}</div><div class="brow"><button class="btn sm sjcalc" data-i="${choiceItems.length+s.fill.length+i}">📖 查看答案/解析</button></div><div class="qans sjans"></div></div>`).join("")}</div>`);
  }
  if(s.solve.length){
    secs.push(`<div class="card sjsec"><h3>四、解答题（共 ${s.solve.length} 题，每题 ${d.solveP} 分）</h3>${short(s.solve,d.solveN)}${s.solve.map((item,i)=>`<div class="qbox sjq"><div class="qstem"><span class="qno">${(choiceItems.length+s.fill.length+s.read.length+i+1)}.</span>${richQ(item.q)}</div><div class="sjwrite"></div><div class="brow"><button class="btn sm sjcalc" data-i="${choiceItems.length+s.fill.length+s.read.length+i}">📖 查看答案/解析</button></div><div class="qans sjans"></div></div>`).join("")}</div>`);
  }
  if(s.essay.length){

    <button class="btn" id="sjBack">返回模拟卷首页</button>
  </div></div>`;
  window._sjChoiceItems=choiceItems;
  $$("#main .sjopt").forEach(b=>b.onclick=()=>sjJudgeChoice(+b.dataset.i,b.dataset.k));
  $$("#main .sjcalc").forEach(b=>b.onclick=()=>sjShowCalc(+b.dataset.i));

}
function subjName(s){return s==="cn"?"语文":s==="math"?"数学":"英语"}
function sjJudgeChoice(i,k){
  const s=window._sj;
  if(s.marked["c"+i])return;
  const item=window._sjChoiceItems[i];if(!item)return;
  s.marked["c"+i]=1;
  const card=$$("#main .sjq")[i];
  const btns=card?card.querySelectorAll(".sjopt"):[];
  const pts=item._pts||0;
  if(item.ans){
    const ok=k===item.ans;
    btns.forEach(b=>{b.classList.add("dis");if(b.dataset.k===item.ans)b.classList.add("correct");});
    if(ok){s.score+=pts;s.right++;}
    else{btns.forEach(b=>{if(b.dataset.k===k)b.classList.add("wrong")});wbAdd(s.ckType,item._t||s.subj+"·选择题",item.q,item.opts[k]||k,item.opts[item.ans]||item.ans,"模拟卷答错收录"+(item.note?"；"+item.note:""));}
    const a=card?card.querySelector(".sjans"):null;
    if(a){a.innerHTML=`<b>${ok?"✅ 回答正确，+"+pts+" 分":"❌ 回答错误（已进错题本）"}</b> 答案：${esc(item.opts[item.ans]||item.ans)}${item.note?`<br>解析：${esc(item.note)}`:""}`;a.classList.add("show");}
    s.done++;s.score=s.score;
  }else{
    // 官方未附答案：不判分，提示自评
    btns.forEach(b=>{if(b.dataset.k===k)b.classList.add("sel")});
    const a=card?card.querySelector(".sjans"):null;
    if(a){a.innerHTML=`<span class="muted">本题官方未附答案（来源未提供），不做对错判定，请参考题面提示自行核对教材/原卷。</span><div class="brow" style="margin-top:6px"><button class="btn sm pri" data-sjok="1">✅ 我答对了</button><button class="btn sm" data-sjok="0">❌ 我答错了</button></div>`;a.classList.add("show");
      a.querySelectorAll("[data-sjok]").forEach(b=>b.onclick=()=>{const ok=b.dataset.sjok==="1";if(ok){s.score+=pts;s.right++}else{wbAdd(s.ckType,item._t||s.subj+"·选择题",item.q,item.opts[k]||k,"来源未提供","模拟卷自评答错收录（官方未附答案，此条为自评记录）")}s.done++;a.innerHTML=`<b>${ok?"✅ 已自评答对，+"+pts+" 分":"❌ 已自评答错（已进错题本）"}</b>`;const sc=$(".sj-sc");if(sc)sc.textContent=s.score;});
    }
  }
  const sc=$(".sj-sc");if(sc)sc.textContent=s.score;
}
function sjShowCalc(i){
  const s=window._sj,row=s.seq[i];if(!row)return;
  const item=row.item;
  // 纯单选（选项按钮点选判分）不走自评；内嵌选项题（多选/选项在题干）走查看答案自评
  if(row.kind==="choice"&&item.opts&&Object.keys(item.opts).length>=2)return;
  if(s.marked["calc"+i])return;
  s.marked["calc"+i]=1;
  const card=$$("#main .sjq")[i];
  const a=card?card.querySelector(".sjans"):null;
  if(!a)return;
  a.innerHTML=`<b>参考答案：</b>${esc(item.ans||"来源未提供（官方未附答案）")}${item.note?`<br><b>解析：</b>${esc(item.note)}`:""}
  <br><span class="muted">自评本题（答错自动进错题本）：</span>
  <div class="brow" style="margin-top:6px"><button class="btn sm pri" data-sjok="1">✅ 我答对了</button><button class="btn sm" data-sjok="0">❌ 我答错了</button></div>`;
  a.classList.add("show");
  a.querySelectorAll("[data-sjok]").forEach(b=>b.onclick=()=>{
    const ok=b.dataset.sjok==="1";
    if(ok){s.score+=item._pts||0;s.right++;}
    else wbAdd(s.ckType,item._t||s.subj+"·主观",item.q,"（自评答错）",item.ans||"来源未提供","模拟卷自评答错收录（官方未附答案时此条为自评记录）"+(item.note?"；"+item.note:""));
    s.done++;
    a.innerHTML=`<b>${ok?"✅ 已自评答对，+"+(item._pts||0)+" 分":"❌ 已自评答错（已进错题本）"}</b>`;
    const sc=$(".sj-sc");if(sc)sc.textContent=s.score;
  });
}
function sjSubmit(){

/* ============ 单词综合测试（每个词库通用：严格按单招/春考考纲词汇范围抽题，合格率判定并如实标注依据） ============ */
const K_VWTEST="vw_test_hist";
const VWTEST_PASS=80; // 合格线（自定义）：官方考纲仅规定词汇范围（春考/单招均为教育部《中职英语课程标准》2490词），未公布统一「合格率」数字，本测试合格线 80% 为自定义阈值，不冒充官方标准。
const vwTestHist=()=>{try{return JSON.parse(localStorage.getItem(K_VWTEST))||[]}catch(e){return[]}};
const vwTestHistSave=h=>{localStorage.setItem(K_VWTEST,JSON.stringify(h.slice(0,30)));cloudSave(K_VWTEST,h.slice(0,30))};
function vwTestOpts(item,list,n){
  // 生成 n 个释义选项（含正确答案，去重、避开相同释义）
  const right=String(item.m||"").trim()||String(item.w||"");
  const opts=[right];
  const cand=list.filter(x=>x!==item&&String(x.m||"").trim()&&String(x.m||"").trim()!==right);
  for(const c of cand){
    const v=String(c.m||"").trim();
    if(opts.indexOf(v)<0){opts.push(v);if(opts.length>=n)break}
  }
  while(opts.length<n){opts.push("释义待补充")}
  const idx=Math.floor(Math.random()*opts.length);
  return {right,list:opts,at:idx};
}
function startVwTest(){
  const list=vwList();
  if(list.length<4){toast("当前词库词太少，无法组测试");return}
  const pool=shuffle(list.slice()).slice(0,20);
  const items=pool.map(w=>{
    const mode=Math.random();
    if(mode<0.55)return{kind:"en2cn",w:w};   // 看英文选中文释义
    if(mode<0.85)return{kind:"cn2en",w:w};   // 看中文选英文单词
    return{kind:"spell",w:w};                // 看中文拼写英文
  });
  window._vwTest={list:pool,items,idx:0,right:0,wrong:0,wrongList:[],done:false};
  paintVwTest();
}
function paintVwTest(){
  const T=window._vwTest;if(!T)return;
  const list=T.list,items=T.items,i=T.idx;
  if(i>=items.length){vwTestFinish();return}
  const it=items[i],w=it.w,idx=vwTestOpts(it.w,list,4);
  const pct=Math.round(i/items.length*100);
  let body;
  if(it.kind==="en2cn"){
    body=`<div class="muted" style="margin:8px 0">看英文选中文释义：</div>
      <div class="vwword">${esc(w.w)}${w.p?` <span class="vwphon">${esc(w.p)}</span>`:""}${w.f?` <span class="vwfreq">${esc(w.f)}</span>`:""}<button class="snd" data-snd="${esc(w.w)}">🔊</button></div>
      <div class="brow wrap">${idx.list.map((v,k)=>`<button class="qopt wt-opt" data-k="${k}">${"ABCD"[k]}. ${esc(v)}</button>`).join("")}</div>`;
  }else if(it.kind==="cn2en"){
    body=`<div class="muted" style="margin:8px 0">看中文释义选英文单词：</div>
      <div class="vwword">${esc(w.m||"释义待补充")}</div>
      <div class="brow wrap">${idx.list.map((v,k)=>`<button class="qopt wt-opt" data-k="${k}">${"ABCD"[k]}. ${esc(v)}</button>`).join("")}</div>`;
  }else{
    body=`<div class="muted" style="margin:8px 0">看中文释义，拼写英文单词：</div>
      <div class="vwword">${esc(w.m||"释义待补充")}</div>
      <input class="qin" id="wtIn" placeholder="请输入英文拼写，回车判定…" style="font-size:20px" autocomplete="off" spellcheck="false">
      <div class="brow"><button class="btn pri" id="wtChk">✓ 判定</button><button class="btn" id="wtSkip">⏭ 跳过</button></div>`;
  }
  $("#main").innerHTML=`<h2 class="pg">🎯 单词综合测试 <span class="muted" style="font-size:14px">（${i+1}/${items.length} · 正确 ${T.right} · 错误 ${T.wrong}）</span></h2>
  <div class="card vwcard">
    <div class="pbar big"><i style="width:${pct}%"></i></div>
    ${body}
    <div class="qans wt-ans"></div>
  </div>
  <div class="brow"><button class="btn" id="wtQuit">⏹ 结束测试（返回背单词）</button></div>`;
  const judge=(ok,you)=>{
    if(T.done)return;
    T.done=true;
    if(ok)T.right++;else{T.wrong++;T.wrongList.push(it.w)}
    const a=$("#main .wt-ans");
    const ansText=it.kind==="en2cn"?`${esc(w.w)} ${esc(w.p||"")} → ${esc(w.m||"释义待补充")}`:it.kind==="cn2en"?`${esc(w.m||"")} → ${esc(w.w)} ${esc(w.p||"")}`:`${esc(w.m||"")} → ${esc(w.w)} ${esc(w.p||"")}`;
    if(a){
      a.innerHTML=`<b>${ok?"✅ 正确":"❌ 错误"}</b> ${ok?"":"答案："}${ansText}${ok?"":"（错词已进生词本）"}`;
      a.classList.add("show");
    }
    if(!ok){
      const wb=vwWb();
      if(!wb.find(y=>y.w===it.w.w))wb.push({w:it.w.w,p:it.w.p||"",m:it.w.m||"",at:Date.now()});
      vwWbSave(wb);
    }
    const nxt=document.createElement("button");
    nxt.id="wtNxt";nxt.className="btn pri";nxt.style.marginTop="10px";nxt.textContent="下一题 →";
    nxt.onclick=()=>{T.done=false;T.idx++;paintVwTest()};
    if(a)a.appendChild(nxt);
  };
  if(it.kind==="spell"){
    const inp=$("#wtIn");if(inp){inp.focus();inp.addEventListener("keydown",e=>{if(e.key==="Enter"){const c=$("#wtChk");if(c)c.click()}})}
    const chk=$("#wtChk");if(chk)chk.onclick=()=>{
      const given=(inp?inp.value.trim():"").toLowerCase().replace(/\s+/g," ");
      const right=String(w.w).trim().toLowerCase().replace(/\s+/g," ");
      if(!given){toast("先输入拼写再判定");return}
      judge(given===right,given);
      inp.disabled=true;
    };
    const sk=$("#wtSkip");if(sk)sk.onclick=()=>{if(!T.done)judge(false,"（跳过）")};
  }else{
    $$("#main .wt-opt").forEach(b=>b.onclick=()=>{
      if(T.done)return;
      const k=+b.dataset.k;
      b.classList.add("dis");
      const ok=k===idx.at;
      if(ok)b.classList.add("correct");else b.classList.add("wrong");
      judge(ok,idx.list[k]);
    });
  }
  const q=$("#wtQuit");if(q)q.onclick=()=>{window._vwTest=null;renderVwHome()};
}
function vwTestFinish(){
  const T=window._vwTest;if(!T)return;
  const n=T.items.length,right=T.right;
  const pct=Math.round(right/Math.max(1,n)*100);
  const pass=pct>=VWTEST_PASS;
  const hist=vwTestHist();
  hist.push({lib:cfgLoad().vwlib||"zz2600",at:Date.now(),pct,pass,n});
  vwTestHistSave(hist);
  $("#main").innerHTML=`<h2 class="pg">🎯 单词综合测试 · 完成</h2>
  <div class="card" style="text-align:center;padding:28px">
    <div style="font-size:44px">${pass?"🎉":"💪"}</div>
    <h3>共 ${n} 题 · 答对 ${right} · 答错 ${T.wrong}</h3>
    <div class="big" style="font-size:30px;margin:10px 0">正确率 ${pct}%</div>
    <div class="muted">合格线：${VWTEST_PASS}%（${pass?"✅ 达标":"❌ 未达标，错词已进生词本，建议复习后再测"}）</div>
    <p class="muted" style="margin-top:6px">判定依据说明：单招/春考英语词汇范围均为教育部《中等职业学校英语课程标准》2490 词（山东省教育招生考试院《英语考试标准》PDF 明文规定）；官方考纲未公布统一「合格率」数字，本测试合格线 ${VWTEST_PASS}% 为自定义阈值。</p>
    ${T.wrongList.length?`<div class="card" style="text-align:left"><b>本次答错的词（已进生词本）：</b><div style="margin-top:4px">${T.wrongList.map(x=>`<span class="vwtag no" style="margin:2px">${esc(x.w)} ${esc(x.p||"")} <button class="snd" data-snd="${esc(x.w)}">🔊</button></span>`).join("")}</div></div>`:""}
    <div class="brow" style="justify-content:center;margin-top:12px">
      <button class="btn pri" id="wtAgain">🔁 再测一轮</button><button class="btn" id="wtBack">返回背单词首页</button>
    </div>
  </div>`;
  $$("#main .snd[data-snd]").forEach(b=>b.onclick=()=>speakWord(b.dataset.snd));
  const a=$("#wtAgain");if(a)a.onclick=startVwTest;
  const b=$("#wtBack");if(b)b.onclick=renderVwHome;
}

function wzOcrRun(){
  if(IS_MOBILE){toast("手机版暂不支持拍照识别，请手动输入作文");return}
  const imgs=window._wzImgs||[];
  if(!imgs.length){toast("请先上传作文照片（可多张）");return}
  const box=$("#wzText");const bt=$("#wzOcr");
  if(bt){bt.textContent="⏳ 识别中…";bt.disabled=true}
  const parts=[];
  const ocrOne=(d,i)=>fetch("/api/ocr",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({img:d.split(",")[1]||""})}).then(r=>r.json());
  (async()=>{
    try{
      for(let i=0;i<imgs.length;i++){
        const d=await ocrOne(imgs[i],i);
        const t0=d.text||"";
        if(!d.ok){parts.push("【第"+(i+1)+"张】识别失败："+(d.err||"未知错误"));continue}
        if(t0==="__NO_LANG__"){parts.push("【第"+(i+1)+"张】未识别到文字（系统缺中文OCR语言包，请手动输入该页）");continue}
        if(t0==="__NO_ENGINE__"){parts.push("【第"+(i+1)+"张】未识别到文字（本机OCR引擎不可用，请手动输入该页）");continue}
        if(t0.startsWith("__RAPID_ERR__")){parts.push("【第"+(i+1)+"张】识别异常（"+(t0.slice(13)||"未知")+"），请拍清晰些或手动输入该页");continue}
        parts.push("【第"+(i+1)+"张】"+(t0.trim()||"（未识别到文字：请拍清晰、字迹工整，或手动输入）"));
      }
      if(bt){bt.textContent="🔍 识别文字";bt.disabled=false}
      const merged=parts.join("\n\n");
      if(box){
        if(imgs.length===1&&parts.length===1&&parts[0].startsWith("【第1张】"))box.value=parts[0].slice(6);
        else box.value=merged;
      }
      toast("识别完成（"+imgs.length+" 张已拼接），可修改校正后评分");
    }catch(e){
      if(bt){bt.textContent="🔍 识别文字";bt.disabled=false}
      toast("识别服务不可用："+e.message);
    }
  })();
}

/* ===== v2.49.2 作文评分加固：切题核对 / 语种检测 / 答题卡废话识别 ===== */
function wzNoiseWords(){return ["答案无效","黑色边框","超出黑色","作答区域","指定区域","准考证号","条形码","缺考","区域内作答","贴条形码","在指定"]}
function isAnswerNoise(s){
  const ns=wzNoiseWords().filter(w=>s.includes(w));
  const chars=(s.replace(/\s+/g,"")||"").length;
  return ns.length>=2 && chars<200;
}
function wzLangStats(s){
  const en=(s.match(/[a-zA-Z]/g)||[]).length;
  const cn=(s.match(/[\u4e00-\u9fff]/g)||[]).length;
  return {en,cn};
}
function wzReqKeywords(req){
  const stop=["的","了","以","请","写","作","文","一篇","不少于","字","为","题","要求","题目","根据","然后","内容","用","英语","语文","介绍","描述","谈谈","关于","你","我","他","她","们","和","与","及","在","对","把","让","要","个","这","那","是","有","就","都","而","其","上","下","中","内","外","为题","请以","写一篇","记叙文","议论文","说明文","应用文","字数","作文","一次","时","也","会","能","好","很","到","从","等","哪些","哪"];
  // 优先取引号/书名号里的核心词（如“成长路上的……”→ 成长）
  const quotes=(req.match(/[“"「『][^”"」』]{2,16}[”"」』]/g)||[]).map(q=>q.slice(1,-1));
  const base=quotes.length?quotes:[req||""];
  const frags=[];
  base.forEach(b=>{
    let s=b.replace(/[^\u4e00-\u9fffa-zA-Z]/g," ");
    stop.forEach(w=>{s=s.split(w).join(" ")});
    (s.split(/\s+/)||[]).forEach(seg=>{
      const mm=seg.match(/[\u4e00-\u9fff]{2,}|[a-zA-Z]{3,}/g);
      if(mm)mm.forEach(w=>frags.push(w));
    });
  });
  // ≥3字的关键词额外补其前2字，提高“成长”类命中率
  const out=[];
  [...new Set(frags)].forEach(w=>{out.push(w);if(w.length>=3)out.push(w.slice(0,2))});
  return [...new Set(out)].sort((a,b)=>b.length-a.length).slice(0,4);
}
function wzFitLocal(t,req){
  const t2=(t||"").replace(/\s+/g,"");
  const kws=wzReqKeywords(req);
  if(!kws.length)return {fit:null,note:""};
  let hit=0;const missed=[];
  kws.forEach(k=>{if(t2.includes(k))hit++;else missed.push(k)});
  const fit=Math.round(hit/kws.length*10);
  const note=hit===0?`未发现与题目关键词（${kws.join("、")}）相关的内容，疑似跑题/不符合题目要求`:`命中题目关键词 ${hit}/${kws.length}（${kws.filter(k=>t2.includes(k)).join("、")}）${missed.length?`，未命中：${missed.join("、")}`:""}`;
  return {fit,note};
}
function wzScoreRun(){
  const ta=$("#wzText");if(!ta)return;
  const t=(ta.value||"").trim();
  if(!t){toast("请先输入或识别出作文内容");return}
  const cfg=cfgLoad();
  const isEn=cfg.wzLang==="en";
  const rq=$("#wzReq");const req=(rq&&rq.value||"").trim();
  const fl=wzFitLocal(t,req);
  const r=isEn?wzScoreEn(t,req):wzScoreCn(t,req);
  r.t=t;r.req=req;r.at=Date.now();r.lang=isEn?"en":"cn";r.fit=fl.fit;r.fitNote=fl.note;
  const hist=wzHist();hist.unshift(r);wzHistSave(hist);
  wzShowResult(r);
  if((cfg.wzAiKey||"").trim())wzAiScore(r);
  else toast(req?"已按本地指标评分；在设置填入 AI Key 可启用含切题核对的深度评分":"已按本地指标评分；在设置填入 AI Key 可启用深度评分");
}

      let obj=null;try{obj=JSON.parse(d.reply)}catch(e){const m=d.reply.match(/\{[\s\S]*\}/);if(m)try{obj=JSON.parse(m[0])}catch(e2){}}
      if(!obj||!obj.score){throw new Error("AI返回格式异常")}
      r.ai={score:obj.score,band:obj.band||"",fit:obj.fit!=null?obj.fit:null,fitNote:obj.fitNote||"",comment:obj.comment||"",advice:obj.advice||""};
      const hist=wzHist();
      const idx=hist.findIndex(h=>h.at===r.at&&h.t===r.t);
      if(idx>=0){hist[idx]=r;wzHistSave(hist)}
      wzShowResult(r);
    }).catch(e=>toast("AI评分失败："+e.message+"（可在设置中检查 Key 与网络）"));
}

/* 语文作文本地评分：客观指标（字数/段落/连接词/标点）；最终分数按山东春考标准 45 分制换算；支持切题核对与答题卡废话识别 */
function wzScoreCn(t,req){
  const s=(t||"").trim();
  const chars=(s.replace(/\s+/g,"")||"").length;
  const noise=isAnswerNoise(s);
  const fl=wzFitLocal(s,req);
  const paras=s.split(/\n+/).map(x=>x.trim()).filter(Boolean).length;
  const sents=(s.match(/[。！？!?]+/g)||[]).length;
  const connectors=["首先","其次","然后","接着","最后","总之","然而","但是","因此","所以","不仅","而且","一方面","另一方面"].filter(w=>s.includes(w)).length;
  const punctErr=(s.match(/[，。；]{2,}/g)||[]).length;
  let content=30,structure=25,lang=25,std=20;
  if(chars<200){content=12}else if(chars<300){content=20}else if(chars<500){content=26}else{content=30}
  if(chars>1000)content=28;
  if(paras<=1){structure=14}else if(paras===2){structure=18}else if(paras<=5){structure=24}else{structure=21}
  if(paras>1&&sents>=3)structure=Math.min(25,structure+1);
  lang=15+Math.min(10,connectors*3);
  if(chars>=300&&sents>=4)lang=Math.min(25,lang+2);
  std=Math.max(8,20-punctErr*2);
  if(sents===0)std=Math.max(6,std-4);
  const percent=Math.max(0,Math.min(100,content+structure+lang+std));
  // 春考换算：满分45；字数不足700字每少50字扣1分
  let score45=Math.round(percent/100*45);
  if(chars<700)score45=Math.max(0,score45-Math.floor((700-chars)/50));
  // 切题核对：命中题目关键词的比例折算总分（完全不扣题约砍半，全命中不扣）
  let fitNote=fl.note,fitInfo="";
  if(fl.fit!=null){
    const k=(0.5+fl.fit/20);
    score45=Math.max(0,Math.round(score45*k));
    fitInfo=`（${fl.note}，按切题度折算）`;
  }
  if(noise){score45=Math.min(score45,2);fitInfo="识别内容疑似答题卡提示语，非作文正文";}
  const band=score45>=36?"一等（36—45分）":score45>=30?"二等（30—35分）":score45>=24?"三等（24—29分）":"四等（23分以下）";
  const comment=`共约 ${chars} 字、${paras} 段、${sents} 句；连接词 ${connectors} 处${punctErr?"、标点连用 "+punctErr+" 处":""}。${noise?"识别到的文字含答题卡提示语（如「超出黑色边框的答案无效」），无法作为作文评分，请重拍或手动输入正文。":""}${fl.fit!=null?(fl.fit>=8?"切题度好，围绕题目展开。":fl.fit>=5?"部分切题，注意紧扣题目要求。":"明显偏离题目要求，请按题目重写。")+fitInfo:"未提供题目要求，未做切题核对。"}${chars<700?"字数不足700字（每少50字扣1分）；":""}${paras<=1?"全文只有一段，层次不清晰；":""}${connectors<2?"缺少过渡词，行文衔接生硬；":""}${std<18?"标点规范需要加强；":""}${chars>=700&&paras>=3&&connectors>=2?"字数、段落、过渡词均达标，注意打磨立意与文采冲一等卷；":""}`;
  const advice=[];
  if(fl.fit!=null&&fl.fit<5)advice.push("重读题目要求（"+req+"），围绕题目关键词"+wzReqKeywords(req).join("、")+"重写，先扣题再展开");
  if(chars<700)advice.push("春考要求不少于700字，当前"+chars+"字，务必补足到700字以上");
  if(paras<=2)advice.push("分成 3—5 段：开头点题、中间分论、结尾总结");
  if(connectors<2)advice.push("多用「首先/其次/然而/总之」等过渡词，让层次更清楚");
  if(std<18)advice.push("检查标点，避免句号逗号连用，段末用句号");
  if(paras>1&&sents>=3&&chars>=700)advice.push("整体结构完整，可进一步打磨开头与结尾的感染力");
  if(noise)advice.unshift("请重新拍照（只拍作文正文区）或手动输入作文内容后再评分");
  return {total:score45,band,scale:"ck45",content,structure,langS:lang,std,comment,advice:advice.join("；"),noise,noiseWords:noise?wzNoiseWords().filter(w=>s.includes(w)).join("、"):"",fit:fl.fit,fitNote:fl.note};
}

/* 英语写作本地评分：词数/句型/连接词/规范；最终分数按山东春考标准 10 分制（四档）换算；支持语种检测与切题核对 */
function wzScoreEn(t,req){
  const s=(t||"").trim();
  const ls=wzLangStats(s);
  const noise=isAnswerNoise(s);
  const fl=wzFitLocal(s,req);
  const words=(s.match(/[a-zA-Z']+/g)||[]);
  const nw=words.length;
  const sents=s.split(/[.!?]+/).map(x=>x.trim()).filter(Boolean);
  const ns=sents.length;
  const capStart=sents.filter(x=>/^[A-Z]/.test(x)).length;
  const connectors=["first","second","third","then","next","finally","however","therefore","but","and","because","in conclusion","in addition","on the other hand","what's more","moreover"].filter(w=>s.toLowerCase().includes(w)).length;
  const avg=nw&&ns?Math.round(nw/ns*10)/10:0;
  let content=30,structure=20,lang=30,std=20;
  if(nw<50){content=14}else if(nw<80){content=22}else if(nw<130){content=27}else{content=30}
  if(nw>250)content=28;
  if(ns<=1){structure=10}else if(ns<=2){structure=14}else if(ns<=6){structure=19}else{structure=20}
  lang=18+Math.min(12,connectors*2);
  if(ns>=3&&avg>=6&&avg<=18)lang=Math.min(30,lang+2);
  if(ns&&capStart!==ns)std-=Math.min(8,Math.round((ns-capStart)*3));
  if(nw&&!s.trim().endsWith(".")&&!s.trim().endsWith("!")&&!s.trim().endsWith("?"))std=Math.max(6,std-2);
  const percent=Math.max(0,Math.min(100,content+structure+lang+std));
  // 语种检测：中文占比远高于英文 → 判定不是英语作文
  const notEn=ls.cn>=40&&ls.cn>ls.en*2;
  // 春考四档换算：第一档10 / 第二档7-9（>=60词）/ 第三档4-6（>=40词）/ 第四档1-3
  let score,band;
  if(nw<40){score=percent>=60?3:percent>=40?2:1;band="第四档（1—3分）· 词数不足40，内容未展开";}
  else if(nw<60){score=4+Math.round(percent/100*2);band="第三档（4—6分）";}
  else if(nw<80){score=7+Math.round(percent/100*2);band="第二档（7—9分）";}
  else if(nw<=120){score=percent>=85?10:percent>=70?9:8;band=score===10?"第一档（10分）":"第一档线内（10分封顶），语言/内容仍有瑕疵";}
  else{score=Math.min(8,7+Math.round(percent/100*1));band="第二档（7—9分）· 词数超过120，超出范围酌情降档";}
  // 切题核对折算（英语同样适用）
  let fitInfo="";
  if(fl.fit!=null){
    const k=(0.5+fl.fit/20);
    score=Math.max(0,Math.round(score*k));
    fitInfo=`（${fl.note}，按切题度折算）`;
  }
  if(notEn){score=Math.min(score,0);band="非英语作文（0分）· 检测到文章主要为中文";fitInfo="检测到文章主要是中文，不是英语作文，无法按英语写作评分";}
  if(noise){score=Math.min(score,1);fitInfo="识别内容疑似答题卡提示语，非作文正文";}
  const comment=`共 ${nw} 词、${ns} 句、平均每句 ${avg} 词；连接词 ${connectors} 处；句首大写 ${ns?capStart+"/"+ns:0}。${notEn?"⚠️ 检测到文章主要是中文（中文"+ls.cn+"字/英文"+ls.en+"词），不是英语作文，请上传英文作文或切换为语文评分。":""}${noise?"识别到的文字含答题卡提示语，无法作为作文评分，请重拍或手动输入正文。":""}${fl.fit!=null?(fl.fit>=8?"切题度好，围绕题目展开。":fl.fit>=5?"部分切题，注意覆盖题目要点。":"明显偏离题目要求，请按题目重写。")+fitInfo:"未提供题目要求，未做切题核对。"}${nw<80?"词数偏少，内容展开不足；":""}${ns<=2?"句子太短太少，结构单薄；":""}${connectors<2?"缺少连接词，行文跳跃；":""}${ns&&capStart!==ns?"有句首未大写或句末缺标点；":""}${nw>=80&&nw<=120&&ns>=4?"词数达标、结构完整，注意要点覆盖与书写工整（书写差会降档）；":""}`;
  const advice=[];
  if(notEn)advice.push("当前识别/输入的是中文内容，请改用英文写作，或在上方切换为「语文」评分");
  if(fl.fit!=null&&fl.fit<5)advice.push("重读题目要求（"+req+"），围绕题目关键词"+wzReqKeywords(req).join("、")+"重写，先扣题再展开");
  if(nw<80)advice.push("春考写作要求80—120词，当前"+nw+"词，需补足到80词以上并覆盖题目要点");
  if(ns<=3)advice.push("用 and/but/because/however 连接成 4—6 句的完整段落");
  if(connectors<2)advice.push("加入 First/In addition/Finally 等过渡词");
  if(ns&&capStart!==ns)advice.push("检查每句首字母大写与句末标点");
  if(nw>=80&&ns>=4)advice.push("词数达标，可尝试使用定语从句等复杂句式、确保覆盖全部要点冲第一档");
  if(noise)advice.unshift("请重新拍照（只拍作文正文区）或手动输入作文内容后再评分");
  return {total:score,band,scale:"ck10",content,structure,langS:lang,std,comment,advice:advice.join("；"),noise,noiseWords:noise?wzNoiseWords().filter(w=>s.includes(w)).join("、"):"",langCheck:notEn,fit:fl.fit,fitNote:fl.note};
}
